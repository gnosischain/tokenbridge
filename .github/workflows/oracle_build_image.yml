name: Publish Oracle Docker Image From Release

on:
  workflow_run:
    workflows: ["Create Github Release"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_tag.outputs.version }}
      digest:  ${{ steps.build.outputs.digest }}
      commit:  ${{ github.event.workflow_run.head_sha }}
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v2

      # Pointing to old repo of contracts: TODO add ABIS from tokenbridge-contracts
      # - name: Checkout
      #   uses: actions/checkout@v2
      #   with:
      #     repository: gnosischain/tokenbridge-contracts
      #     path: ./contracts
      #     ref: 908a48107919d4ab127f9af07d44d47eac91547e

      # Step 2: Extract version tag
      - name: Get current version tag
        id: get_tag
        run: |
          git fetch --tags
          latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "version=$latest_tag" >> "$GITHUB_OUTPUT"

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_ACCESS_TOKEN_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN_SECRET }}

      # Step 4: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 5: Build and push Docker image
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./oracle/Dockerfile
          push: true
          no-cache: true
          tags: gnosischain/tokenbridge-oracle:${{ steps.get_tag.outputs.version }},gnosischain/tokenbridge-oracle:latest

      # Step 6: Record (commit -> digest) binding for lightweight verification
      - name: Record release binding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:    ${{ steps.get_tag.outputs.version }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE:  gnosischain/tokenbridge-oracle
          REPO:   ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "$DIGEST" ]]; then
            echo "::error::No digest emitted by build step — aborting." >&2
            exit 1
          fi

          # 1. Workflow run summary (visible on the Actions tab)
          {
            echo "## Release binding"
            echo
            echo "| field  | value |"
            echo "|--------|-------|"
            echo "| tag    | \`$TAG\` |"
            echo "| commit | \`$COMMIT\` |"
            echo "| image  | \`$IMAGE:$TAG\` |"
            echo "| digest | \`$DIGEST\` |"
            echo
            echo "Verify locally:"
            echo
            echo '```bash'
            echo "ACTUAL=\$(docker buildx imagetools inspect $IMAGE:$TAG --format '{{.Manifest.Digest}}')"
            echo "[ \"\$ACTUAL\" = \"$DIGEST\" ] && echo match || echo MISMATCH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 2. Durable: append the binding to the GitHub Release body
          NOTES=$(cat <<EOF

          ---

          **Published image**

          - image:  \`$IMAGE:$TAG\`
          - digest: \`$DIGEST\`
          - commit: \`$COMMIT\`

          Verify (one command, no rebuild):
          \`\`\`
          docker buildx imagetools inspect $IMAGE:$TAG --format '{{.Manifest.Digest}}'
          \`\`\`
          The output should equal the digest above.
          EOF
          )
          gh release edit "$TAG" --repo "$REPO" --notes-append "$NOTES"

  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: publish
    uses: ./.github/workflows/slack_release_notification.yml
    secrets:
      RELEASES_SLACK_WEBHOOK_URL: ${{ secrets.RELEASES_SLACK_WEBHOOK_URL }}
    with:
      environment: Production
      service: Tokenbridge Oracle
      success: ${{ contains(join(needs.*.result, ','), 'success') }}
      message: "Released `Tokenbridge Oracle` version `${{ needs.publish.outputs.version }}` from commit `${{ needs.publish.outputs.commit }}`. Triggered by `${{ github.actor }}`. Image digest: `${{ needs.publish.outputs.digest }}`. Docker Hub: https://hub.docker.com/r/gnosischain/tokenbridge-oracle/tags?name=${{ needs.publish.outputs.version }}"